<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LINKS PARA OS FAVICONS -->
    <link rel="icon" href="./favicons/favicons-16x16.png">
    <link rel="stylesheet" href="./css/style.css">

    <!-- TÍTULO DA PÁGINA -->
    <title>Pokédex</title>
</head>
<body>

<!-- CONTEÚDO DA PÁGINA -->
    <main>
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/6.gif" alt="animated sprite of Charizard from Pokemon facing left in pixel art style" class="pokemon_image">


        <h1 class="pokemon_data"> 
            <span class="pokemon_number">6</span> -
            <span class="pokemon_name">charizard</span>
        </h1>
        <!-- classes para chamar os respectivos nomes e numeros dos pokemon da pokedex no CSS -->

        <form class="form">
            <input
                type="search"
                class="input_search"
                placeholder="Name or Number"
                required
            />
        </form>
        <!-- CRIANDO UM FORMULARIO PARA A BUSCA DOS POKÉMON PELO NOME OU NÚMERO -->


        <img src="./images/pokedex.png" alt="pokedex" class="pokedex">

    </main>
    
</body>
</html>
