<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LINKS -->
    <link rel="icon" href="./favicons/favicons-16x16.png">
    <link rel="stylesheet" href="./css/style.css">

    <!-- MAIN JS -->
    <script defer src="./js/main.js"></script>


    <!-- TÍTULO DA PÁGINA -->
    <title>Pokédex</title>
</head>

<body>

    <!-- CONTEÚDO DA PÁGINA -->
    <main>
        <img src="#"
            alt="pokemon" 
            class="pokemon_image">

        <!-- QUAL POKEMON VAI APARECER NA PÁGINA -->
        <h1 class="pokemon_data">
            <span class="pokemon_number"></span> -
            <span class="pokemon_name"></span>
        </h1>

        <!-- classes para chamar os respectivos nomes e numeros dos pokemon da pokedex no CSS -->

        <form class="form">
            <input type="search" class="input_search" placeholder="Nome ou Número do Pokémon" required />
        </form>
        <!-- CRIANDO UM FORMULARIO PARA A BUSCA DOS POKÉMON PELO NOME OU NÚMERO -->

        <div class="buttons">
            <button class="button btn-prev">Prev &lt;</button>
            <button class="button btn-next">Next ></button>
        </div>
        <!-- CRIANDO OS BOTOES DE NAVEGAÇÃO -->
        <!-- VSCODE NAO ACEITA OS CARACTERES < E > ENTAO É RECOMENDADO USAR &lt; E &gt; QUE SAO SEUS RESPECTIVOS CODIGOS DE ESCAPE -->


        <img src="./images/pokedex.png" alt="pokedex" class="pokedex">
        <!-- IMAGEM DA POKÉDEX -->

    </main>

</body>

</html>
